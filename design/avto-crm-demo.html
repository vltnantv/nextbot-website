<title>Автокъща CRM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
/* Layout: quiet productivity-tool shell — light sidebar, white canvas, hairline borders, one indigo accent; bottom tab bar on phone; side sheet for records */
:root{
  --bg:#fbfbfc; --panel:#ffffff; --panel-2:#f4f4f6; --ink:#1a1a1f; --muted:#6b6b77; --faint:#9c9ca8; --line:#ebebef; --line-2:#dfdfe5;
  --accent:#5b5bd6; --accent-ink:#ffffff; --accent-soft:#eeeefc;
  --side:#f6f6f8; --side-2:#ebebf0; --side-ink:#3a3a44; --side-dim:#8a8a96; --side-hi:#1a1a1f;
  --bad:#d4443b; --bad-soft:#fdeeec; --warn:#b86e00; --warn-soft:#fdf3e2; --ok:#1f8a55; --ok-soft:#e7f5ed;
  --shadow:0 1px 2px rgba(20,20,30,.04),0 8px 28px rgba(20,20,30,.08);
  --f-ui:"Golos Text",system-ui,-apple-system,"Segoe UI",sans-serif; --f-num:"Golos Text",system-ui,sans-serif; --f-mono:"JetBrains Mono",ui-monospace,monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e11; --panel:#141417; --panel-2:#1b1b20; --ink:#ececf0; --muted:#9a9aa6; --faint:#6e6e7a; --line:#232329; --line-2:#2e2e36;
  --accent:#8e8cf7; --accent-ink:#0e0e11; --accent-soft:#1f1f3a;
  --side:#111114; --side-2:#1d1d22; --side-ink:#c4c4ce; --side-dim:#74747f; --side-hi:#ffffff;
  --bad:#f0776d; --bad-soft:#2d1716; --warn:#e6a54a; --warn-soft:#2c2213; --ok:#5dcb8e; --ok-soft:#132a1d;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e0e11; --panel:#141417; --panel-2:#1b1b20; --ink:#ececf0; --muted:#9a9aa6; --faint:#6e6e7a; --line:#232329; --line-2:#2e2e36;
  --accent:#8e8cf7; --accent-ink:#0e0e11; --accent-soft:#1f1f3a;
  --side:#111114; --side-2:#1d1d22; --side-ink:#c4c4ce; --side-dim:#74747f; --side-hi:#ffffff;
  --bad:#f0776d; --bad-soft:#2d1716; --warn:#e6a54a; --warn-soft:#2c2213; --ok:#5dcb8e; --ok-soft:#132a1d;
  --shadow:0 1px 2px rgba(0,0,0,.5),0 10px 30px rgba(0,0,0,.45); color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--f-ui);-webkit-font-smoothing:antialiased;letter-spacing:-.003em}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.app{display:grid;grid-template-columns:224px 1fr;min-height:100%}
/* sidebar */
aside{background:var(--side);border-right:1px solid var(--line);color:var(--side-ink);padding:14px 10px;display:flex;flex-direction:column;gap:18px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:9px;padding:4px 8px}
.logo{width:26px;height:26px;border-radius:7px;background:var(--ink);display:grid;place-items:center;color:var(--bg)}
.brand b{font:600 14px var(--f-ui);color:var(--side-hi);letter-spacing:-.01em}
.brand small{display:block;font-size:11.5px;color:var(--side-dim);line-height:1.2}
.snav{display:grid;gap:1px}
.snav button{display:flex;align-items:center;gap:10px;border:0;background:transparent;color:var(--side-ink);padding:6px 9px;border-radius:7px;text-align:left;font-weight:500;font-size:13.5px}
.snav button svg{color:var(--side-dim)}
.snav button:hover{background:var(--side-2)}
.snav button[aria-current="page"]{background:var(--side-2);color:var(--side-hi)}
.snav button[aria-current="page"] svg{color:var(--accent)}
.snav .cnt{margin-left:auto;font-size:11px;color:var(--bad);font-weight:600}
.sfoot{margin-top:auto;display:grid;gap:6px}
.me{display:flex;align-items:center;gap:9px;padding:7px 8px;border-radius:8px}
.me:hover{background:var(--side-2)}
.me .av{background:var(--ink);color:var(--bg)}
.me .who{color:var(--side-hi);font-weight:600}
.me small{display:block;color:var(--side-dim);font-size:11.5px;line-height:1.2}
.reset{border:0;background:transparent;color:var(--side-dim);border-radius:7px;padding:6px 9px;font-size:12.5px;text-align:left}
.reset:hover{background:var(--side-2);color:var(--side-ink)}
/* main */
main{min-width:0;padding:20px 32px 60px;max-width:1320px}
.top{display:flex;align-items:center;gap:14px;margin-bottom:22px;flex-wrap:wrap;padding-bottom:16px;border-bottom:1px solid var(--line)}
.top h1{font:600 20px/1.25 var(--f-ui);margin:0;letter-spacing:-.022em;text-wrap:balance}
.top .sub{color:var(--muted);font-size:13px;margin-top:2px}
.top .grow{flex:1;min-width:0}
.search{position:relative;width:min(320px,100%)}
.search input{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:8px;padding:7px 44px 7px 32px;font:inherit}
.search input::placeholder{color:var(--faint)}
.search svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--faint)}
.search kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:500 11px var(--f-ui);color:var(--faint);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:var(--panel-2)}
.results{position:absolute;top:calc(100% + 6px);left:0;right:0;background:var(--panel);border:1px solid var(--line);border-radius:10px;box-shadow:var(--shadow);z-index:30;padding:5px;max-height:340px;overflow:auto}
.results button{display:flex;width:100%;gap:10px;align-items:center;border:0;background:transparent;padding:7px 8px;border-radius:6px;text-align:left}
.results button:hover{background:var(--panel-2)}
.results small{color:var(--muted)}
.results .lab{font-size:11px;color:var(--faint);padding:6px 8px 2px;font-weight:500}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line-2);background:var(--panel);border-radius:7px;padding:6px 11px;font-weight:500;font-size:13px;white-space:nowrap;box-shadow:0 1px 1px rgba(0,0,0,.03)}
.btn:hover{background:var(--panel-2)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.pri:hover{filter:brightness(1.06);background:var(--accent)}
.btn.sm{padding:4px 9px;font-size:12.5px}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.danger{color:var(--bad)}
/* panels */
.grid{display:grid;gap:14px}
.kpis{grid-template-columns:repeat(4,minmax(0,1fr));gap:0!important;border:1px solid var(--line);border-radius:10px;background:var(--panel);overflow:hidden}
.kpis>.panel{border:0;border-radius:0;border-right:1px solid var(--line)}
.kpis>.panel:last-child{border-right:0}
.two{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px;min-width:0}
.panel h3{margin:0 0 12px;font-size:13px;font-weight:600;display:flex;align-items:center;gap:7px}
.panel h3 svg{color:var(--faint)}
.panel h3 .r{margin-left:auto;font-weight:400;color:var(--faint);font-size:12px}
.kpi{display:grid;gap:3px}
.kpi .lab{color:var(--muted);font-size:12.5px}
.kpi .val{font:600 22px/1.2 var(--f-num);letter-spacing:-.025em}
.kpi .d{font-size:12px;color:var(--faint)}
.kpi .d b{font-weight:600}
.up{color:var(--ok)} .down{color:var(--bad)}
.kpi.alert .val{color:var(--bad)}
/* chips */
.chip{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;padding:1px 8px;border-radius:6px;background:var(--panel);color:var(--muted);border:1px solid var(--line-2);white-space:nowrap;line-height:1.55}
.chip.a{color:var(--accent);background:var(--accent-soft);border-color:transparent}
.chip.bad{color:var(--bad);background:var(--bad-soft);border-color:transparent}
.chip.warn{color:var(--warn);background:var(--warn-soft);border-color:transparent}
.chip.ok{color:var(--ok);background:var(--ok-soft);border-color:transparent}
.dot{width:6px;height:6px;border-radius:50%;background:currentColor;display:inline-block}
.av{width:26px;height:26px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:600;flex:none;background:var(--accent-soft);color:var(--accent)}
.av.sm{width:20px;height:20px;font-size:9.5px}
/* tasks */
.tasks{display:grid;gap:0}
.task{display:grid;grid-template-columns:auto 1fr auto;gap:11px;align-items:center;padding:9px 6px;border-radius:7px;border-bottom:1px solid var(--line)}
.task:last-child{border-bottom:0}
.task:hover{background:var(--panel-2)}
.task .ck{width:17px;height:17px;border-radius:50%;border:1.5px solid var(--line-2);background:transparent;display:grid;place-items:center;padding:0}
.task .ck:hover{border-color:var(--accent)}
.task.done .ck{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.task.done .tt{text-decoration:line-through;color:var(--faint)}
.task .tt{font-weight:500;min-width:0}
.task .ts{font-size:12px;color:var(--faint)}
.task .open{border:0;background:transparent;text-align:left;padding:0;min-width:0}
.empty{color:var(--faint);font-size:13px;padding:18px 8px;text-align:center}
/* chart */
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--faint);font-size:11px;font-family:var(--f-ui)}
.funnel{display:grid;gap:7px}
.frow{display:grid;grid-template-columns:92px 1fr 30px;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.ftrack{height:18px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.ffill{height:100%;background:var(--accent);border-radius:4px;opacity:.85}
.frow .n{text-align:right;font-weight:600;color:var(--ink)}
/* toolbar */
.toolbar{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:14px}
.seg{display:inline-flex;background:var(--panel-2);border-radius:8px;padding:2px}
.seg button{border:0;background:transparent;padding:4px 11px;border-radius:6px;font-weight:500;font-size:12.5px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}
select.sel,input.inp,textarea.inp{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:7px;padding:6px 9px;font:inherit;font-size:13px;min-width:0}
.pill{border:1px dashed var(--line-2);background:transparent;border-radius:7px;padding:4px 10px;font-size:12.5px;font-weight:500;color:var(--muted)}
.pill:hover{background:var(--panel-2)}
.pill[aria-pressed="true"]{border-style:solid;border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
/* board */
.board{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(248px,1fr);gap:10px;overflow-x:auto;padding-bottom:10px}
.col{background:var(--panel-2);border-radius:10px;padding:8px;display:grid;gap:6px;align-content:start;min-height:220px}
.colh{display:flex;align-items:center;gap:7px;padding:4px 6px 6px;font-weight:600;font-size:12.5px}
.colh .chip{border:0;background:transparent;padding:0;color:var(--faint)}
.colh .sum{margin-left:auto;color:var(--faint);font-weight:400;font-size:12px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 11px;display:grid;gap:6px;text-align:left;box-shadow:0 1px 2px rgba(0,0,0,.03);position:relative}
.card:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.card.late::after{content:"";position:absolute;top:12px;right:11px;width:7px;height:7px;border-radius:50%;background:var(--bad)}
.card .nm{font-weight:600;padding-right:14px}
.card .cr{font-size:12px;color:var(--muted)}
.card .ft{display:flex;align-items:center;gap:5px;flex-wrap:wrap}
.card .ft .av{margin-left:auto}
/* table list */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;font-weight:500;color:var(--faint);font-size:12px;padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl tr.click{cursor:pointer}
.tbl tr.click:hover td{background:var(--panel-2)}
.tbl .r{text-align:right}
.scroll{overflow-x:auto}
/* cars */
.cars{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
.car{background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;display:grid;text-align:left;padding:0}
.car:hover{border-color:var(--line-2);box-shadow:var(--shadow)}
.ph{aspect-ratio:16/8;max-width:100%;background:var(--panel-2);display:grid;place-items:center;position:relative;border-bottom:1px solid var(--line)}
.ph svg{width:60%;height:auto}
.ph .st{position:absolute;top:9px;left:9px}
.ph .age{position:absolute;top:9px;right:9px}
.ph .chip{background:var(--panel)}
.ph .chip.bad{background:var(--bad-soft)} .ph .chip.warn{background:var(--warn-soft)} .ph .chip.ok{background:var(--panel);color:var(--ok);border-color:var(--line-2)}
.car .bd{padding:11px 13px 13px;display:grid;gap:3px}
.car .md{font-weight:600}
.car .sp{font-size:12px;color:var(--faint)}
.car .pr{display:flex;align-items:baseline;justify-content:space-between;margin-top:6px}
.car .pr b{font:600 16px var(--f-num);letter-spacing:-.02em}
.car .pr small{font-size:12px;color:var(--ok);font-weight:500}
.mono{font-family:var(--f-mono);font-size:11.5px;color:var(--faint)}
/* warranty */
.wbar{height:4px;background:var(--panel-2);border-radius:2px;overflow:hidden;min-width:80px}
.wbar i{display:block;height:100%;background:var(--accent)}
.wbar.warn i{background:var(--warn)} .wbar.bad i{background:var(--bad)}
/* bars generic */
.hb{display:grid;gap:9px}
.hbr{display:grid;grid-template-columns:104px 1fr 84px;gap:10px;align-items:center;font-size:12.5px}
.hbr .t{height:8px;background:var(--panel-2);border-radius:4px;overflow:hidden}
.hbr .t i{display:block;height:100%;background:var(--accent);border-radius:4px}
.hbr .v{text-align:right;color:var(--faint)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,10,15,.28);z-index:40;animation:fade .15s}
.sheet{position:fixed;top:8px;right:8px;bottom:8px;width:min(500px,calc(100% - 16px));background:var(--panel);border:1px solid var(--line);border-radius:12px;z-index:41;display:flex;flex-direction:column;box-shadow:var(--shadow);animation:slide .18s ease-out;overflow:hidden}
.sh-h{padding:16px 18px 14px;border-bottom:1px solid var(--line);display:flex;gap:12px;align-items:flex-start}
.sh-h h2{margin:0;font:600 17px/1.3 var(--f-ui);letter-spacing:-.02em}
.sh-h .x{margin-left:auto;border:0;background:transparent;border-radius:6px;width:28px;height:28px;display:grid;place-items:center;flex:none;color:var(--faint)}
.sh-h .x:hover{background:var(--panel-2);color:var(--ink)}
.sh-b{padding:16px 18px calc(28px + env(safe-area-inset-bottom,0px));overflow-y:auto;display:grid;gap:20px;align-content:start}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.stepper{display:flex;gap:0;flex-wrap:wrap;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;width:fit-content;max-width:100%}
.stepper button{border:0;border-right:1px solid var(--line-2);background:var(--panel);padding:5px 10px;font-size:12.5px;font-weight:500;color:var(--muted)}
.stepper button:last-child{border-right:0}
.stepper button:hover{background:var(--panel-2)}
.stepper button.past{color:var(--accent);background:var(--accent-soft)}
.stepper button.cur{background:var(--accent);color:var(--accent-ink)}
.kv{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px}
.kv div{min-width:0}
.kv small{display:block;color:var(--faint);font-size:12px;margin-bottom:1px}
.kv b{font-weight:500;font-size:13.5px;overflow-wrap:anywhere}
.kv .link{border:0;background:none;padding:0;color:var(--accent);font-weight:500;text-align:left}
.sec{font-size:12px;color:var(--faint);font-weight:500;margin:0 0 8px}
.tl{display:grid;gap:0;position:relative}
.tli{display:grid;grid-template-columns:20px 1fr;gap:10px;padding-bottom:14px;position:relative}
.tli::before{content:"";position:absolute;left:9.5px;top:22px;bottom:2px;width:1px;background:var(--line-2)}
.tli:last-child::before{display:none}
.tli .ic{width:20px;height:20px;border-radius:50%;background:var(--panel-2);display:grid;place-items:center;color:var(--muted)}
.tli .ic.a{background:var(--accent-soft);color:var(--accent)}
.tli .ic.ok{background:var(--ok-soft);color:var(--ok)}
.tli .x1{font-size:13px}
.tli .x2{font-size:11.5px;color:var(--faint)}
.note{display:flex;gap:6px}
.note input{flex:1}
.costs{width:100%;border-collapse:collapse;font-size:13px}
.costs td{padding:6px 0;border-bottom:1px solid var(--line);color:var(--muted)}
.costs td:last-child{text-align:right;color:var(--ink)}
.costs tr.tot td{border-bottom:0;font-weight:600;padding-top:9px;color:var(--ink)}
.profit{display:flex;gap:10px;align-items:center;justify-content:space-between;background:var(--ok-soft);color:var(--ok);padding:11px 13px;border-radius:8px;font-weight:500}
.profit b{font:600 19px var(--f-num);letter-spacing:-.02em}
/* modal */
.modal{position:fixed;left:50%;top:14%;transform:translateX(-50%);width:min(480px,calc(100% - 32px));background:var(--panel);border:1px solid var(--line);border-radius:12px;z-index:41;box-shadow:var(--shadow);padding:18px;display:grid;gap:14px;animation:fade .12s;max-height:80%;overflow:auto}
.modal h2{margin:0;font:600 15px var(--f-ui)}
.form{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form label{display:grid;gap:4px;font-size:12px;color:var(--muted);font-weight:500;min-width:0}
.form .full{grid-column:1/-1}
.form .inp,.form .sel{width:100%}
.mfoot{display:flex;justify-content:flex-end;gap:6px;padding-top:12px;border-top:1px solid var(--line)}
/* fab + bottom nav */
.fab{position:fixed;right:24px;bottom:24px;width:44px;height:44px;border-radius:12px;border:0;background:var(--ink);color:var(--bg);display:grid;place-items:center;box-shadow:var(--shadow);z-index:20}
.fab:hover{transform:translateY(-1px)}
.bnav{display:none}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--panel);color:var(--ink);border:1px solid var(--line-2);box-shadow:var(--shadow);padding:9px 14px;border-radius:9px;font-weight:500;font-size:13px;z-index:60;display:flex;gap:8px;align-items:center;max-width:calc(100% - 32px)}
.toast svg{color:var(--ok)}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes slide{from{transform:translateX(16px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:1080px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis>.panel:nth-child(2){border-right:0}.kpis>.panel:nth-child(-n+2){border-bottom:1px solid var(--line)}.two{grid-template-columns:1fr}}
@media (max-width:820px){
  .app{grid-template-columns:1fr}
  aside{display:none}
  main{padding:14px 16px calc(96px + env(safe-area-inset-bottom,0px))}
  .top{padding-bottom:12px;margin-bottom:16px}
  .top h1{font-size:18px}
  .search{width:100%;order:3}
  .search kbd{display:none}
  .kpi .val{font-size:19px}
  .panel{padding:13px}
  .bnav{display:grid;grid-template-columns:repeat(5,1fr);position:fixed;left:0;right:0;bottom:0;background:var(--panel);border-top:1px solid var(--line);z-index:25;padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
  .bnav button{border:0;background:transparent;display:grid;justify-items:center;gap:2px;font-size:10.5px;font-weight:500;color:var(--faint);padding:4px 0;position:relative}
  .bnav button[aria-current="page"]{color:var(--ink)}
  .bnav button[aria-current="page"] svg{color:var(--accent)}
  .bnav .cnt{position:absolute;top:0;right:calc(50% - 20px);background:var(--bad);color:#fff;border-radius:999px;font-size:10px;padding:0 5px;line-height:16px}

 <div><p class="sec">Разходи и печалба</p><table class="costs num"><tr><td>Покупна цена</td><td>${eur(c.buy)}</td></tr>${Object.entries(c.costs).map(([k,v])=>`<tr><td>${k}</td><td>${eur(v)}</td></tr>`).join('')}<tr class="tot"><td>Обща себестойност</td><td>${eur(c.buy+costSum(c))}</td></tr></table>
 <div class="profit" style="margin-top:12px"><span>Печалба при ${eur(c.price)}<br><small style="font-weight:500">марж ${(profit(c)/c.price*100).toFixed(1)}%</small></span><b class="num">${eur(profit(c))}</b></div></div>
 <div><p class="sec">Клиенти за тази кола</p>${ints.length?`<div class="tasks">${ints.map(l=>`<button class="task open" style="grid-template-columns:1fr auto;border:0;background:transparent;text-align:left" data-open-lead="${l.id}"><div><div class="tt">${esc(l.name)}</div><div class="ts">${l.stage} · ${REPS[l.rep]}</div></div>${nextChip(l)}</button>`).join('')}</div>`:'<div class="empty" style="text-align:left;padding:4px 0">Още няма запитвания. Колата може да се нуждае от по-добра обява или цена.</div>'}</div>`;
 openSheet(carName(c),`${statusChip(c.status)}<span class="chip">${c.year}</span>${c.arrived>45&&c.status!=='Продадена'?`<span class="chip ${c.arrived>60?'bad':'warn'}">стои ${c.arrived} дни</span>`:''}`,body);
}
function showSold(id){
 cur={t:'sold',id};const s=S.sold.find(x=>x.id===id),e=wEnd(s);
 const body=`<div class="acts"><button class="btn pri" data-sact="remind">${ic('bell',16)}Напомни на клиента</button><button class="btn" data-sact="ext">${ic('shield',16)}Оферта за удължена гаранция</button><button class="btn" data-sact="svc">${ic('wrench',16)}Запиши час в сервиз</button></div>
 <div class="kv">
  <div><small>Телефон</small><b class="num">${esc(s.phone)}</b></div><div><small>Продадена</small><b>${fd(-s.ago)} (${s.ago} дни)</b></div>
  <div><small>Цена</small><b class="num">${eur(s.price)}</b></div><div><small>Търговец</small><b>${REPS[s.rep]}</b></div>
  <div><small>Гаранция</small><b>${s.w} месеца, ${e<0?'изтекла':`до ${fd(e)}`}</b></div><div><small>Следващо обслужване</small><b>${s.svc<0?`пропуснато (${fd(s.svc)})`:fd(s.svc)}</b></div>
 </div>
 <div class="empty" style="text-align:left;padding:0">Всяка изтичаща гаранция е повод за обаждане: удължена гаранция, обслужване или следваща кола.</div>`;
 openSheet(s.name,`<span class="chip">${esc(s.car)}</span>${e<=30&&e>=0?`<span class="chip bad">гаранцията изтича след ${e} дни</span>`:''}${s.reminded?'<span class="chip ok">напомнено</span>':''}`,body);
}
function modal(kind){
 const carOpts=S.cars.filter(c=>c.status!=='Продадена').map(c=>`<option value="${c.id}">${esc(carName(c))} · ${eur(c.price)}</option>`).join('');
 const repOpts=Object.entries(REPS).map(([k,n])=>`<option value="${k}">${n}</option>`).join('');
 const forms={
  lead:`<label>Име<input class="inp" id="m_name" required placeholder="напр. Александър Иванов"></label><label>Телефон<input class="inp" id="m_ph" required placeholder="0888 123 456" inputmode="tel"></label>
   <label class="full">Кола<select class="sel" id="m_car">${carOpts}</select></label><label>Бюджет, €<input class="inp" id="m_bud" type="number" value="20000" inputmode="numeric"></label>
   <label>Източник<select class="sel" id="m_src">${SOURCES.map(s=>`<option>${s}</option>`).join('')}</select></label><label>Търговец<select class="sel" id="m_rep">${repOpts}</select></label>
   <label>Лизинг<select class="sel" id="m_lea"><option value="">Не</option><option value="1">Да</option></select></label>`,
  car:`<label>Марка<input class="inp" id="m_make" required placeholder="напр. Volvo"></label><label>Модел<input class="inp" id="m_model" required placeholder="XC60 D4"></label>
   <label>Година<input class="inp" id="m_year" type="number" value="2019"></label><label>Пробег, км<input class="inp" id="m_km" type="number" value="120000"></label>
   <label>Покупна цена, €<input class="inp" id="m_buy" type="number" value="18000"></label><label>Разходи (транспорт, ремонт), €<input class="inp" id="m_cost" type="number" value="1500"></label>
   <label>Продажна цена, €<input class="inp" id="m_price" type="number" value="23500"></label><label>Гориво<select class="sel" id="m_fuel"><option>Дизел</option><option>Бензин</option><option>Хибрид</option><option>Електро</option></select></label>`,
  task:`<label class="full">Задача<input class="inp" id="m_x" required placeholder="напр. Обади се на застрахователя"></label><label>Кога<select class="sel" id="m_due"><option value="0">Днес</option><option value="1">Утре</option><option value="3">След 3 дни</option></select></label><label>Отговорник<select class="sel" id="m_rep">${repOpts}</select></label>`
 };
 const names={lead:'Нов клиент',car:'Нова кола',task:'Нова задача'};
 $('#overlay').innerHTML=`<div class="scrim" data-close></div><form class="modal" id="mform" data-kind="${kind}" role="dialog" aria-modal="true" aria-label="${names[kind]}">
 <div style="display:flex;align-items:center;gap:10px"><h2>${names[kind]}</h2><div class="seg" style="margin-left:auto">${Object.entries(names).map(([k,n])=>`<button type="button" data-mk="${k}" aria-pressed="${k===kind}">${n.split(' ')[1]}</button>`).join('')}</div></div>
 <div class="form">${forms[kind]}</div><div class="mfoot"><button type="button" class="btn" data-close>Отказ</button><button class="btn pri" type="submit">Добави</button></div></form>`;
 setTimeout(()=>$('#mform input')?.focus(),30);
}

/* ---------- actions ---------- */
function toast(t){const e=$('#toast');e.innerHTML=ic('check',16,2.4)+esc(t);e.hidden=false;clearTimeout(e._t);e._t=setTimeout(()=>e.hidden=true,2200)}
function addH(l,t,x){l.h.push({d:0,t,x,by:l.rep})}
function leadAct(a){
 const l=lead(cur.id);
 if(a==='call'){const i=SI(l.stage);if(i>-1&&i<2){l.stage=STAGES[i+1]}addH(l,'call',`Разговор. Следващо обаждане ${fd(3)}.`);l.next=3;toast(`${l.name}: следващо обаждане ${fd(3)}`)}
 if(a==='visit'){if(SI(l.stage)<1)l.stage='Оглед';l.next=2;addH(l,'visit',`Насрочен оглед за ${fd(2)}.`);toast(`Оглед с ${l.name} на ${fd(2)}`)}
 if(a==='note'){const v=$('#noteIn').value.trim();if(!v)return;addH(l,'note',v);toast('Бележката е записана')}
 if(a==='lost'){l.lostStage=l.stage;l.stage='Изгубен';l.lost='Отказа се';l.next=null;addH(l,'note','Маркиран като изгубен.');toast(`${l.name} е маркиран като изгубен`)}
 if(a==='won'){const c=car(l.car);l.stage='Продаден';l.next=null;c.status='Продадена';addH(l,'stage',`Продадена ${carName(c)} за ${eur(c.price)}.`);
  S.sold.unshift({id:'s'+(++S.seq),name:l.name,phone:l.phone,car:carName(c),rep:l.rep,ago:0,price:c.price,profit:profit(c),w:12,svc:180,reminded:false});toast(`Продажба! ${carName(c)} · печалба ${eur(profit(c))}`)}
 render();showLead(l.id);
}
function doneTask(k,id){
 if(k==='lead'){const l=lead(id);l.next=3;addH(l,'call',`Разговор. Следващо обаждане ${fd(3)}.`);toast(`${l.name}: следващо обаждане ${fd(3)}`)}
 if(k==='task'){const t=S.tasks.find(x=>x.id===id);t.done=!t.done}
 if(k==='war'){const s=S.sold.find(x=>x.id===id);s.reminded=true;toast(`Напомняне към ${s.name} е насрочено`)}
 render();
}
function render(){chrome();$('#view').innerHTML={dash:vDash,clients:vClients,cars:vCars,service:vService,reports:vReports}[S.ui.view]()}
function go(v){S.ui.view=v;closeSheet();render();window.scrollTo({top:0})}

document.addEventListener('click',e=>{
 const b=e.target.closest('[data-go],[data-open-lead],[data-open-car],[data-open-sold],[data-done],[data-lact],[data-stage],[data-cstat],[data-sact],[data-mode],[data-late],[data-carf],[data-warf],[data-act],[data-close],[data-mk],[data-res]');
 if(!b){if(!e.target.closest('.search'))$('#results').hidden=true;return}
 const d=b.dataset;
 if(d.go)return go(d.go);
 if(d.res){$('#results').hidden=true;$('#q').value='';const[t,id]=d.res.split(':');return t==='l'?showLead(id):showCar(id)}
 if(d.done!==undefined){const[k,id]=d.done.split(':');return doneTask(k,id)}
 if(d.openLead)return showLead(d.openLead);
 if(d.openCar)return showCar(d.openCar);
 if(d.openSold)return showSold(d.openSold);
 if(d.lact)return leadAct(d.lact);
 if(d.stage){const l=lead(cur.id);if(l.stage!==d.stage){l.stage=d.stage;if(l.next===null)l.next=2;addH(l,'stage',`Етап: ${d.stage}.`);toast(`${l.name} → ${d.stage}`)}render();return showLead(l.id)}
 if(d.cstat){const c=car(cur.id);c.status=d.cstat;toast(`${carName(c)}: ${d.cstat}`);render();return showCar(c.id)}
 if(d.sact){const s=S.sold.find(x=>x.id===cur.id);s.reminded=true;toast(d.sact==='ext'?`Оферта за удължена гаранция към ${s.name}`:d.sact==='svc'?`Час в сервиза за ${s.name}: ${fd(5)}`:`Напомняне към ${s.name} е насрочено`);if(d.sact==='svc')s.svc=5;render();return showSold(s.id)}
 if(d.mode){S.ui.mode=d.mode;return render()}
 if(d.late!==undefined){S.ui.late=!S.ui.late;return render()}
 if(d.carf){S.ui.carF=d.carf;return render()}
 if(d.warf){S.ui.warF=d.warf;return render()}
 if(d.mk)return modal(d.mk);
 if(d.close!==undefined)return closeSheet();
 if(d.act==='add')return modal(S.ui.view==='cars'?'car':'lead');
 if(d.act==='add-lead')return modal('lead');
 if(d.act==='add-car')return modal('car');
 if(d.act==='reset'){const v=S.ui.view;S=seed();S.ui.view=v;closeSheet();render();return toast('Демото е върнато в начално състояние')}
});
document.addEventListener('change',e=>{
 if(e.target.id==='fRep'){S.ui.rep=e.target.value;render()}
 if(e.target.id==='fSrc'){S.ui.src=e.target.value;render()}
 if(e.target.id==='lRep'){const l=lead(cur.id);l.rep=e.target.value;toast(`Прехвърлен на ${REPS[l.rep]}`);render();showLead(l.id)}
});
document.addEventListener('keydown',e=>{
 if(e.key==='Escape'){closeSheet();$('#results').hidden=true}
 if(e.key==='Enter'&&e.target.id==='noteIn'){e.preventDefault();leadAct('note')}
 if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus()}
});
$('#q').addEventListener('input',e=>{
 const q=e.target.value.trim().toLowerCase(),r=$('#results');
 if(!q){r.hidden=true;return}
 const ls=S.leads.filter(l=>(l.name+' '+l.phone.replace(/\s/g,'')+' '+l.phone).toLowerCase().includes(q)).slice(0,5);
 const cs=S.cars.filter(c=>(carName(c)+' '+c.vin+' '+c.year).toLowerCase().includes(q)).slice(0,5);
 r.innerHTML=(ls.length?`<div class="lab">Клиенти</div>`+ls.map(l=>`<button data-res="l:${l.id}"><span class="av sm">${ini(l.name)}</span><span><b>${esc(l.name)}</b><br><small>${esc(l.phone)} · ${l.stage}</small></span></button>`).join(''):'')+
  (cs.length?`<div class="lab">Коли</div>`+cs.map(c=>`<button data-res="c:${c.id}"><span class="av sm">${ic('car',12,2)}</span><span><b>${esc(carName(c))}</b><br><small>${c.year} · ${eur(c.price)} · ${c.status}</small></span></button>`).join(''):'')||'<div class="empty">Няма резултати</div>';
 r.hidden=false;
});
document.addEventListener('submit',e=>{
 if(e.target.id!=='mform')return;e.preventDefault();
 const k=e.target.dataset.kind,v=id=>$('#'+id).value.trim();
 if(k==='lead'){const l={id:'l'+(++S.seq),name:v('m_name'),phone:v('m_ph'),car:v('m_car'),budget:+v('m_bud')||0,src:v('m_src'),rep:v('m_rep'),stage:'Запитване',next:0,created:0,leasing:!!v('m_lea'),barter:'',h:[]};
  l.h.push({d:0,t:'in',x:`Запитване от ${l.src} за ${carName(car(l.car))}`,by:l.rep});S.leads.unshift(l);closeSheet();S.ui.view='clients';render();toast(`${l.name} е добавен · обаждане днес`)}
 if(k==='car'){const cost=+v('m_cost')||0;const c={id:'c'+(++S.seq),make:v('m_make'),model:v('m_model'),year:+v('m_year'),km:+v('m_km'),fuel:v('m_fuel'),gear:'Автоматик',hp:150,colorName:'—',paint:'#5a6273',vin:'—',buy:+v('m_buy'),costs:{'Транспорт и ремонт':cost},price:+v('m_price'),status:'Свободна',arrived:0};
  S.cars.unshift(c);closeSheet();S.ui.view='cars';S.ui.carF='Всички';render();toast(`${carName(c)} е добавена · печалба ${eur(profit(c))}`)}
 if(k==='task'){S.tasks.push({id:'t'+(++S.seq),x:v('m_x'),due:+v('m_due'),rep:v('m_rep'),done:false});closeSheet();S.ui.view='dash';render();toast('Задачата е добавена')}
});
$('#fab').innerHTML=ic('plus',24,2.2);$('#logo1').innerHTML=ic('car',19,2);
render();
</script>
